[package]
name = "as-gui"
description = "A Rune based GUI for interfacing with Algolia's Agent Studio agents."
version = "0.0.1"
default-run = "as-gui"
repository = "https://github.com/8bittitan/as-gui"
license = "MIT"
edition = "2024"
publish = false

[lib]
# The doc comments contain code-like inline text rustdoc would compile as doctests; each
# doctest is a fresh executable and every rebuilt executable can raise the Jamf
# `familyControlsEnabled` permission dialog on the dev Mac (see AGENTS.md).
doctest = false

[profile.release]
incremental = true
strip = true

# Benchmarks and perf numbers. Same codegen as release, without incremental, which can move
# frame timings. Copied from Rune's workspace (Cargo ignores dependency profiles). Unstripped
# on purpose, so a perf or Instruments attach works later.
[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 16
lto = false
debug = false
incremental = false
strip = false

# Dependencies build optimized in debug too: unoptimized text shaping and glyph rasterising
# stalled the first frame that showed new text (a tool card opening) for a visible beat. Only
# this crate stays at opt-level 0, so incremental builds keep their speed.
[profile.dev.package."*"]
opt-level = 3

[features]
# The live tuning panel (⌘⇧K). Shipped builds opt out (`just build`) and run on the knobs'
# default values, which are the design constants.
default = ["knobs"]
knobs = ["rune-knobs/panel"]
# The instrumented frame benchmarks (`just bench`): Rune's phase clocks plus procwatch's
# counting allocator. Compiled by CI's clippy line, run only on a dev Mac.
bench = ["rune/frame-profile", "dep:procwatch"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
ureq = { version = "3", features = ["json", "rustls"] }
rune = { git = "https://github.com/anomalyco/rune.git", rev = "04b38ae0a73bda03f010e97d2fff540ab91f67b0", features = [
  "native-file-dialog",
  "macos-background-cursor",
] }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "04b38ae0a73bda03f010e97d2fff540ab91f67b0", features = [
  "markdown",
] }
wgpu = { version = "~30.0.1", default-features = false }
rune-knobs = { git = "https://github.com/anomalyco/rune.git", rev = "04b38ae0a73bda03f010e97d2fff540ab91f67b0" }
rune-notify = { git = "https://github.com/anomalyco/rune.git", rev = "04b38ae0a73bda03f010e97d2fff540ab91f67b0" }
procwatch = { optional = true, git = "https://github.com/anomalyco/rune.git", rev = "04b38ae0a73bda03f010e97d2fff540ab91f67b0" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = [
  "NSScreen",
  "NSPasteboard",
  "NSPasteboardItem",
] }
objc2-foundation = { version = "0.2.2", features = [
  "NSThread",
  "NSArray",
  "NSData",
  "NSString",
] }
tray-icon = { version = "0.26", default-features = false }

[[example]]
name = "frame_bench"
path = "benchmarks/runners/frame_bench.rs"
required-features = ["bench"]

[[example]]
name = "results"
path = "benchmarks/runners/results.rs"
required-features = ["bench"]
test = true
